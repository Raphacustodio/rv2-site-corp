# Serve rv2.inf.br (canonical)
server {
    server_name rv2.inf.br;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rv2.inf.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rv2.inf.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirect www → non-www (HTTPS)
server {
    server_name www.rv2.inf.br;
    return 301 https://rv2.inf.br$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rv2.inf.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rv2.inf.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirect HTTP → HTTPS (non-www)
server {
    listen 80;
    server_name rv2.inf.br;
    return 301 https://rv2.inf.br$request_uri;
}

